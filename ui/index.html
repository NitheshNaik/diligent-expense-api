<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage your personal expenses seamlessly with the Smart Expense Tracker client interface. Check live totals and monthly breakdowns.">
    <title>Smart Expense Tracker - Control Your Spending</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #8b5cf6;
            --accent-primary-glow: rgba(139, 92, 246, 0.3);
            --accent-secondary: #06b6d4;
            --accent-secondary-glow: rgba(6, 182, 212, 0.3);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --success: #10b981;
            --danger: #ef4444;
            --input-bg: rgba(31, 41, 55, 0.5);
            --font-family: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --transition-speed: 0.25s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 20%, rgba(139, 92, 246, 0.1) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(6, 182, 212, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: var(--font-family);
            min-height: 100vh;
            line-height: 1.5;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-width: 400px;
        }

        .toast {
            background: rgba(17, 24, 39, 0.9);
            border-left: 4px solid var(--accent-primary);
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            color: var(--text-primary);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            animation: slideIn 0.3s ease-out forwards;
            backdrop-filter: blur(8px);
        }

        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }

        .toast-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2rem;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Header Area */
        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 3rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--card-border);
        }

        .brand-section h1 {
            font-size: 2.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--text-primary) 30%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.025em;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--danger);
            box-shadow: 0 0 8px var(--danger);
        }

        .status-dot.online {
            background-color: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        /* Top Cards Summary */
        .total-summary-card {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15) 0%, rgba(6, 182, 212, 0.15) 100%);
            border: 1px solid var(--card-border);
            padding: 1.5rem 2rem;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(12px);
        }

        .total-summary-card span {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .total-summary-card h2 {
            font-family: var(--font-mono);
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 15px var(--accent-primary-glow);
        }

        /* Grid Layout */
        .app-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 768px) {
            .app-grid {
                grid-template-columns: 380px 1fr;
            }
        }

        /* Card Panels */
        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .panel-title {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #fff;
            border-left: 3px solid var(--accent-primary);
            padding-left: 0.75rem;
        }

        /* Custom forms & inputs */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-control {
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            padding: 0.75rem 1rem;
            outline: none;
            transition: all var(--transition-speed) ease;
            width: 100%;
        }

        .form-control:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-primary-glow);
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-primary) 0%, #7c3aed 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            transition: all var(--transition-speed) ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 6px -1px var(--accent-primary-glow);
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px var(--accent-primary-glow);
            filter: brightness(1.1);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger) 0%, #dc2626 100%);
            box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.25);
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }

        .btn-danger:hover {
            box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.35);
        }

        /* Filter Section */
        .filter-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-end;
        }

        .filter-section .form-group {
            flex: 1 1 200px;
        }

        /* Expense List */
        .expense-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .expense-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            transition: all var(--transition-speed) ease;
        }

        .expense-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.04);
            transform: scale(1.005);
        }

        .expense-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .expense-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: #fff;
        }

        .expense-metadata {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .category-tag {
            background: rgba(6, 182, 212, 0.15);
            color: var(--accent-secondary);
            border: 1px solid rgba(6, 182, 212, 0.3);
            padding: 0.125rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.025em;
        }

        .expense-amount-area {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .expense-value {
            font-family: var(--font-mono);
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
            border: 2px dashed var(--card-border);
            border-radius: 12px;
        }

        .empty-state h3 {
            color: #fff;
            margin-bottom: 0.5rem;
            font-size: 1.25rem;
        }

        /* Monthly Summary Breakdowns */
        .monthly-summary-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .summary-month {
            font-weight: 500;
            color: var(--text-secondary);
        }

        .summary-value {
            font-family: var(--font-mono);
            font-weight: 600;
            color: #fff;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 3px solid var(--accent-primary);
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Toast Area -->
        <div id="toastContainer" class="toast-container" aria-live="polite"></div>

        <!-- Header Area -->
        <header>
            <div class="brand-section">
                <h1>Smart Expense Tracker</h1>
                <div class="status-badge">
                    <span id="apiStatusDot" class="status-dot"></span>
                    <span id="apiStatusText">Connecting to API...</span>
                </div>
            </div>
            
            <div class="total-summary-card">
                <span>Running Total</span>
                <h2 id="grandTotal">$0.00</h2>
            </div>
        </header>

        <!-- Main grid layout -->
        <main class="app-grid">
            <!-- Left panel: Forms & Aggregates -->
            <div style="display: flex; flex-direction: column; gap: 2rem;">
                <!-- Add Expense Panel -->
                <section class="panel">
                    <h2 class="panel-title" id="formHeader">Add Expense</h2>
                    <form id="addExpenseForm" novalidate>
                        <div class="form-group" style="margin-bottom: 1.25rem;">
                            <label for="title">Title</label>
                            <input type="text" id="title" class="form-control" placeholder="e.g. Weekly Groceries" required>
                        </div>
                        
                        <div class="form-group" style="margin-bottom: 1.25rem;">
                            <label for="amount">Amount ($)</label>
                            <input type="number" id="amount" class="form-control" placeholder="0.00" step="0.01" min="0.01" required>
                        </div>

                        <div class="form-group" style="margin-bottom: 1.25rem;">
                            <label for="category">Category</label>
                            <input type="text" id="category" class="form-control" placeholder="e.g. Food, Transport" required>
                        </div>

                        <div class="form-group" style="margin-bottom: 1.5rem;">
                            <label for="date">Date</label>
                            <input type="date" id="date" class="form-control" required>
                        </div>

                        <button type="submit" id="submitBtn" class="btn" style="width: 100%;">
                            Add Expense
                        </button>
                    </form>
                </section>

                <!-- Monthly Summary Panel -->
                <section class="panel">
                    <h2 class="panel-title">Monthly Breakdown</h2>
                    <div id="monthlySummaryList" class="monthly-summary-list">
                        <!-- Filled by JS -->
                    </div>
                </section>
            </div>

            <!-- Right panel: Listing -->
            <section class="panel" style="flex-grow: 1;">
                <h2 class="panel-title">Expenses Log</h2>

                <!-- Filters -->
                <div class="filter-section">
                    <div class="form-group">
                        <label for="filterCategory">Filter Category</label>
                        <input type="text" id="filterCategory" class="form-control" placeholder="Search category...">
                    </div>
                    <button id="clearFilterBtn" class="btn btn-secondary" style="height: 42px;">Clear</button>
                </div>

                <!-- Expenses dynamic area -->
                <div id="expenseList" class="expense-list">
                    <!-- Filled by JS -->
                    <div class="empty-state">
                        <h3>No expenses logged</h3>
                        <p>Get started by adding your first expense using the form.</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- UI Interaction Logic -->
    <script>
        const API_URL = 'http://localhost:8000';
        
        // Element caching
        const apiStatusDot = document.getElementById('apiStatusDot');
        const apiStatusText = document.getElementById('apiStatusText');
        const grandTotalEl = document.getElementById('grandTotal');
        const addExpenseForm = document.getElementById('addExpenseForm');
        const expenseListEl = document.getElementById('expenseList');
        const monthlySummaryListEl = document.getElementById('monthlySummaryList');
        const filterCategoryInput = document.getElementById('filterCategory');
        const clearFilterBtn = document.getElementById('clearFilterBtn');
        const toastContainer = document.getElementById('toastContainer');
        const submitBtn = document.getElementById('submitBtn');

        // Set default date input value to today
        document.getElementById('date').value = new Date().toISOString().split('T')[0];

        // Global status helper
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span>${message}</span>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s ease-out reverse forwards';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // Check Health
        async function checkAPIHealth() {
            try {
                const res = await fetch(`${API_URL}/health`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.status === 'ok') {
                        apiStatusDot.className = 'status-dot online';
                        apiStatusText.innerText = 'Connected to API';
                        return true;
                    }
                }
            } catch (err) {
                // fall through
            }
            apiStatusDot.className = 'status-dot';
            apiStatusText.innerText = 'API Offline';
            return false;
        }

        // Fetch Grand Total
        async function fetchTotal(category = '') {
            try {
                let url = `${API_URL}/expenses/total`;
                if (category) {
                    url += `?category=${encodeURIComponent(category.trim())}`;
                }
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    grandTotalEl.innerText = `$${Number(data.total).toFixed(2)}`;
                }
            } catch (err) {
                console.error("Error fetching total:", err);
            }
        }

        // Fetch Monthly Breakdown
        async function fetchMonthlySummary() {
            try {
                const res = await fetch(`${API_URL}/expenses/summary/monthly`);
                if (res.ok) {
                    const data = await res.json();
                    monthlySummaryListEl.innerHTML = '';
                    
                    const keys = Object.keys(data);
                    if (keys.length === 0) {
                        monthlySummaryListEl.innerHTML = `
                            <p style="color: var(--text-secondary); font-size: 0.875rem; text-align: center;">
                                No monthly summary data.
                            </p>
                        `;
                        return;
                    }

                    keys.forEach(month => {
                        const row = document.createElement('div');
                        row.className = 'summary-row';
                        row.innerHTML = `
                            <span class="summary-month">${month}</span>
                            <span class="summary-value">$${Number(data[month]).toFixed(2)}</span>
                        `;
                        monthlySummaryListEl.appendChild(row);
                    });
                }
            } catch (err) {
                console.error("Error fetching summary:", err);
            }
        }

        // Fetch & List Expenses
        async function fetchExpenses(category = '') {
            try {
                let url = `${API_URL}/expenses`;
                if (category) {
                    url += `?category=${encodeURIComponent(category.trim())}`;
                }
                
                const res = await fetch(url);
                if (!res.ok) throw new Error("Could not load expenses list");
                
                const expenses = await res.json();
                expenseListEl.innerHTML = '';

                if (expenses.length === 0) {
                    expenseListEl.innerHTML = `
                        <div class="empty-state">
                            <h3>No expenses found</h3>
                            <p>${category ? 'Try broadening your filter criteria.' : 'Create your first logged expense using the form.'}</p>
                        </div>
                    `;
                    return;
                }

                expenses.forEach(exp => {
                    const card = document.createElement('div');
                    card.className = 'expense-card';
                    card.innerHTML = `
                        <div class="expense-info">
                            <div class="expense-title">${escapeHTML(exp.title)}</div>
                            <div class="expense-metadata">
                                <span class="category-tag">${escapeHTML(exp.category)}</span>
                                <span>&bull;</span>
                                <span>${exp.date}</span>
                            </div>
                        </div>
                        <div class="expense-amount-area">
                            <span class="expense-value">$${Number(exp.amount).toFixed(2)}</span>
                            <button class="btn btn-danger" onclick="deleteExpense(${exp.id})">Delete</button>
                        </div>
                    `;
                    expenseListEl.appendChild(card);
                });
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // Delete Action
        async function deleteExpense(id) {
            if (!confirm("Are you sure you want to delete this expense?")) return;

            try {
                const res = await fetch(`${API_URL}/expenses/${id}`, {
                    method: 'DELETE'
                });

                if (res.ok) {
                    showToast("Expense deleted successfully");
                    refreshUI();
                } else {
                    const data = await res.json();
                    showToast(data.error || "Failed to delete expense", 'error');
                }
            } catch (err) {
                showToast("Network error trying to delete expense", 'error');
            }
        }

        // Add Action
        addExpenseForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('title').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const category = document.getElementById('category').value;
            const date = document.getElementById('date').value;

            // Simple HTML validation block
            if (!title.trim()) {
                showToast("Title is required", "error");
                return;
            }
            if (isNaN(amount) || amount <= 0) {
                showToast("Amount must be greater than 0", "error");
                return;
            }
            if (!category.trim()) {
                showToast("Category is required", "error");
                return;
            }
            if (!date) {
                showToast("Date is required", "error");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> Saving...';

            try {
                const res = await fetch(`${API_URL}/expenses`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ title, amount, category, date })
                });

                const data = await res.json();

                if (res.status === 201) {
                    showToast("Expense added successfully!");
                    addExpenseForm.reset();
                    document.getElementById('date').value = new Date().toISOString().split('T')[0];
                    refreshUI();
                } else {
                    showToast(data.error || "Failed to add expense", 'error');
                }
            } catch (err) {
                showToast("Network connection error", 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Add Expense';
            }
        });

        // Filter Handlers
        let filterTimeout;
        filterCategoryInput.addEventListener('input', (e) => {
            clearTimeout(filterTimeout);
            filterTimeout = setTimeout(() => {
                const term = e.target.value;
                fetchExpenses(term);
                fetchTotal(term); // Total should filter along with the list
            }, 300);
        });

        clearFilterBtn.addEventListener('click', () => {
            filterCategoryInput.value = '';
            fetchExpenses();
            fetchTotal();
        });

        // Utility: HTML Escaping
        function escapeHTML(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Global refresh helper
        async function refreshUI() {
            const online = await checkAPIHealth();
            if (online) {
                const term = filterCategoryInput.value;
                fetchExpenses(term);
                fetchTotal(term);
                fetchMonthlySummary();
            }
        }

        // Initial setup
        refreshUI();
        // Regular health polls
        setInterval(checkAPIHealth, 10000);
    </script>
</body>
</html>
